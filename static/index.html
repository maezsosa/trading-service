<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>trading-service</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --surface-page:   #f4f5f3;
    --surface-card:   #ffffff;
    --surface-sunken: #eceeea;
    --border:         #dcded9;
    --text-primary:   #14171a;
    --text-secondary: #565b56;
    --text-muted:     #85897f;
    --accent:         #2a78d6;
    --accent-ink:     #184f95;
    --series-strategy:#2a78d6;
    --series-bh:      #eb6834;
    --status-good:    #0ca30c;
    --status-critical:#d03b3b;
    --grid-line:      #e2e4de;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-page:   #131412;
      --surface-card:   #1a1a19;
      --surface-sunken: #201f1c;
      --border:         #33342f;
      --text-primary:   #f5f4ee;
      --text-secondary: #c3c2b7;
      --text-muted:     #8b8a7f;
      --accent:         #6fa8f0;
      --accent-ink:     #bcd6f8;
      --series-strategy:#3987e5;
      --series-bh:      #d95926;
      --status-good:    #22c522;
      --status-critical:#e66767;
      --grid-line:      #2a2b26;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface-page);
    color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 20px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  h1 {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: clamp(20px, 3vw, 26px);
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub { color: var(--text-secondary); margin: 0 0 24px; font-size: 14px; }

  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }

  form h2, .results h2 {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    margin: 0 0 12px;
  }
  fieldset { border: none; padding: 0; margin: 0 0 16px; }
  fieldset legend {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 0;
    margin-bottom: 8px;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 3px;
  }
  .field input, .field select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface-page);
    color: var(--text-primary);
    font-size: 13.5px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

  .status { font-size: 13px; color: var(--text-muted); margin-top: 10px; min-height: 18px; }
  .status.error { color: var(--status-critical); }

  .legend { display: flex; gap: 18px; margin-bottom: 12px; font-size: 13px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-swatch { width: 16px; height: 2px; border-radius: 1px; }

  svg.chart { display: block; width: 100%; height: 240px; overflow: visible; }
  .gridline { stroke: var(--grid-line); stroke-width: 1; }
  .line-strategy { fill: none; stroke: var(--series-strategy); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .line-bh { fill: none; stroke: var(--series-bh); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .endpoint { r: 3.5; }
  .end-strategy { fill: var(--series-strategy); }
  .end-bh { fill: var(--series-bh); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
  @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface-sunken);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 6px; }
  .stat-vals { display: flex; justify-content: space-between; font-size: 14px; }
  .stat-vals .s { color: var(--series-strategy); font-weight: 600; }
  .stat-vals .b { color: var(--series-bh); }

  .win { color: var(--status-good); }
  .lose { color: var(--status-critical); }

  .placeholder { color: var(--text-muted); font-size: 14px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>trading-service</h1>
  <p class="sub">Corré la estrategia con distintos parámetros contra datos reales y comparala contra buy-and-hold.</p>

  <div class="layout">
    <div class="card">
      <form id="form">
        <fieldset>
          <legend>Datos</legend>
          <div class="field">
            <label for="symbol">Símbolo</label>
            <input id="symbol" value="BTC/USDT">
          </div>
          <div class="row2">
            <div class="field">
              <label for="timeframe">Timeframe</label>
              <select id="timeframe">
                <option value="1h">1h</option>
                <option value="4h">4h</option>
                <option value="1d" selected>1d</option>
              </select>
            </div>
            <div class="field">
              <label for="exchange">Exchange</label>
              <input id="exchange" value="binance">
            </div>
          </div>
          <div class="field">
            <label for="since">Desde</label>
            <input id="since" type="date" value="2024-01-01">
          </div>
          <div class="field">
            <label for="cash">Cash inicial</label>
            <input id="cash" type="number" value="10000" step="100">
          </div>
        </fieldset>

        <fieldset>
          <legend>Estrategia</legend>
          <div class="row2">
            <div class="field">
              <label for="fast_window">Fast window</label>
              <input id="fast_window" type="number" value="10">
            </div>
            <div class="field">
              <label for="slow_window">Slow window</label>
              <input id="slow_window" type="number" value="30">
            </div>
          </div>
          <div class="field">
            <label for="min_separation_pct">Separación mínima (%)</label>
            <input id="min_separation_pct" type="number" value="1" step="0.1">
          </div>
          <div class="row2">
            <div class="field">
              <label for="adx_period">ADX período</label>
              <input id="adx_period" type="number" value="14">
            </div>
            <div class="field">
              <label for="adx_threshold">ADX mínimo (0=off)</label>
              <input id="adx_threshold" type="number" value="0">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Riesgo</legend>
          <div class="row2">
            <div class="field">
              <label for="max_position_pct">Max posición (%)</label>
              <input id="max_position_pct" type="number" value="60" step="1">
            </div>
            <div class="field">
              <label for="risk_per_trade_pct">Riesgo/trade (%)</label>
              <input id="risk_per_trade_pct" type="number" value="3" step="0.1">
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="max_drawdown_pct">Max drawdown (%)</label>
              <input id="max_drawdown_pct" type="number" value="90" step="1">
            </div>
            <div class="field">
              <label for="slippage_pct">Slippage (%)</label>
              <input id="slippage_pct" type="number" value="0" step="0.01">
            </div>
          </div>
        </fieldset>

        <button type="submit" id="run-btn">Correr backtest</button>
        <div class="status" id="status"></div>
      </form>
    </div>

    <div class="card results" id="results">
      <h2>Resultado</h2>
      <div class="placeholder" id="placeholder">Configurá los parámetros y corré un backtest para ver el resultado acá.</div>
      <div id="chart-area" style="display:none">
        <div class="legend">
          <div class="legend-item"><span class="legend-swatch" style="background:var(--series-strategy)"></span>Estrategia</div>
          <div class="legend-item"><span class="legend-swatch" style="background:var(--series-bh)"></span>Buy &amp; hold</div>
        </div>
        <svg class="chart" id="chart" viewBox="0 0 600 240" preserveAspectRatio="none"></svg>
        <div class="stats-grid" id="stats-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const runBtn = document.getElementById('run-btn');
const placeholder = document.getElementById('placeholder');
const chartArea = document.getElementById('chart-area');
const chartSvg = document.getElementById('chart');
const statsGrid = document.getElementById('stats-grid');

function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  const s = n >= 0 ? '+' : '';
  return s + n.toFixed(2) + '%';
}
function fmtNum(n, decimals = 2) {
  return (n === null || n === undefined) ? '—' : n.toFixed(decimals);
}
function pctClass(n) {
  return n >= 0 ? 'win' : 'lose';
}

function renderChart(equityCurve, bhCurve) {
  const w = 600, h = 240, padTop = 10, padBottom = 10;
  const sVals = equityCurve.map(p => p[1]);
  const bVals = bhCurve.map(p => p[1]);
  const all = sVals.concat(bVals);
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const n = equityCurve.length;

  function toPoints(curve) {
    return curve.map((p, i) => {
      const x = (i / (n - 1)) * w;
      const y = padTop + (1 - (p[1] - min) / range) * (h - padTop - padBottom);
      return [x, y];
    });
  }

  const sPts = toPoints(equityCurve);
  const bPts = toPoints(bhCurve);
  const initialCash = equityCurve.length ? equityCurve[0][1] : min;
  const baseY = padTop + (1 - (initialCash - min) / range) * (h - padTop - padBottom);
  const toPath = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
  const sLast = sPts[sPts.length - 1];
  const bLast = bPts[bPts.length - 1];

  chartSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  chartSvg.innerHTML = `
    <line class="gridline" x1="0" y1="${baseY.toFixed(1)}" x2="${w}" y2="${baseY.toFixed(1)}" stroke-dasharray="3,4" />
    <path class="line-bh" d="${toPath(bPts)}" />
    <path class="line-strategy" d="${toPath(sPts)}" />
    <circle class="endpoint end-bh" cx="${bLast[0].toFixed(1)}" cy="${bLast[1].toFixed(1)}" />
    <circle class="endpoint end-strategy" cx="${sLast[0].toFixed(1)}" cy="${sLast[1].toFixed(1)}" />
  `;
}

function renderStats(strategy, bh) {
  const diff = strategy.total_return_pct - bh.total_return_pct;
  statsGrid.innerHTML = `
    <div class="stat">
      <div class="stat-label">Retorno</div>
      <div class="stat-vals"><span class="s">${fmtPct(strategy.total_return_pct)}</span><span class="b">${fmtPct(bh.total_return_pct)}</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Max drawdown</div>
      <div class="stat-vals"><span class="s">${fmtNum(strategy.max_drawdown_pct)}%</span><span class="b">${fmtNum(bh.max_drawdown_pct)}%</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Sharpe</div>
      <div class="stat-vals"><span class="s">${fmtNum(strategy.sharpe_ratio)}</span><span class="b">${fmtNum(bh.sharpe_ratio)}</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">vs. buy-and-hold</div>
      <div class="stat-vals"><span class="${pctClass(diff)}">${fmtPct(diff)}</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Trades cerrados</div>
      <div class="stat-vals"><span class="s">${strategy.num_trades}</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Win rate</div>
      <div class="stat-vals"><span class="s">${fmtNum(strategy.win_rate_pct)}%</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Avg win / loss</div>
      <div class="stat-vals"><span class="s">${fmtNum(strategy.avg_win)} / ${fmtNum(strategy.avg_loss)}</span></div>
    </div>
    <div class="stat">
      <div class="stat-label">Profit factor</div>
      <div class="stat-vals"><span class="s">${fmtNum(strategy.profit_factor)}</span></div>
    </div>
  `;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  runBtn.disabled = true;
  statusEl.textContent = 'Corriendo backtest… (puede tardar unos segundos, trae datos reales)';
  statusEl.classList.remove('error');

  const body = {
    exchange: document.getElementById('exchange').value,
    symbol: document.getElementById('symbol').value,
    timeframe: document.getElementById('timeframe').value,
    since: document.getElementById('since').value ? document.getElementById('since').value + 'T00:00:00Z' : null,
    cash: parseFloat(document.getElementById('cash').value),
    fast_window: parseInt(document.getElementById('fast_window').value, 10),
    slow_window: parseInt(document.getElementById('slow_window').value, 10),
    min_separation_pct: parseFloat(document.getElementById('min_separation_pct').value) / 100,
    adx_period: parseInt(document.getElementById('adx_period').value, 10),
    adx_threshold: parseFloat(document.getElementById('adx_threshold').value),
    max_position_pct: parseFloat(document.getElementById('max_position_pct').value) / 100,
    risk_per_trade_pct: parseFloat(document.getElementById('risk_per_trade_pct').value) / 100,
    max_drawdown_pct: parseFloat(document.getElementById('max_drawdown_pct').value) / 100,
    slippage_pct: parseFloat(document.getElementById('slippage_pct').value) / 100,
  };

  try {
    const resp = await fetch('/backtests/historical', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${text.slice(0, 200)}`);
    }
    const data = await resp.json();

    placeholder.style.display = 'none';
    chartArea.style.display = 'block';
    renderChart(data.equity_curve, data.buy_and_hold_curve);
    renderStats(data.strategy, data.buy_and_hold);
    statusEl.textContent = `${data.bars} barras procesadas.`;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    statusEl.classList.add('error');
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
